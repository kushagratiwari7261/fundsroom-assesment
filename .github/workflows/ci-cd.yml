name: Fundsroom ERP CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # BACKEND - Lint, Type Check & Build
  # ─────────────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Compile Check
        run: npx tsc --noEmit

      - name: Build Production Bundle
        run: npm run build

  # ─────────────────────────────────────────
  # FRONTEND - Lint, Type Check & Build
  # ─────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Production Bundle
        run: npm run build

  # ─────────────────────────────────────────
  # DEPLOY GATE - Only after both CI pass
  # ─────────────────────────────────────────
  deploy:
    name: Deploy Ready
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deployment Status
        run: |
          echo "✅ Backend CI passed"
          echo "✅ Frontend CI passed"
          echo "🚀 Railway auto-deploys backend from main branch"
          echo "🚀 Vercel auto-deploys frontend from main branch"
          echo "Deployment triggered successfully!"
